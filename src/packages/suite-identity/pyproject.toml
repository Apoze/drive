[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apoze-suite-identity"
version = "0.1.5"
description = "Shared identity bindings and directory projections for Apoze applications"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<6.1",
    "django-configurations>=2.5",
    "djangorestframework>=3.15",
    "mozilla-django-oidc>=4,<6",
    "celery>=5.4",
    "requests>=2.32",
]

[project.optional-dependencies]
lasuite = ["django-lasuite>=0.0.24"]

[tool.setuptools.packages.find]
include = ["suite_identity*"]
