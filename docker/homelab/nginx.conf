worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream drive_backend { zone drive_backend 64k; server backend:8000 resolve; }
    upstream drive_frontend { zone drive_frontend 64k; server frontend:8080 resolve; }
    upstream drive_objects { zone drive_objects 64k; server seaweedfs:8333 resolve; }

    include /etc/nginx/mime.types;
    log_format paths '$request_id $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout paths;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # This listener is loopback-only behind the operator's TLS reverse proxy.
    map $http_x_forwarded_proto $scheme_from_proxy { default https; http http; https https; }
    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 0;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme_from_proxy;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        location = /healthz { access_log off; return 200 'ok'; }
        location / { proxy_pass http://drive_frontend; }
        location ~ ^/(api|admin|static|__heartbeat__|__lbheartbeat__)(/|$) {
            proxy_pass http://drive_backend;
        }
        location /media/ {
            access_log off;
            auth_request /media-auth;
            auth_request_set $s3_auth $upstream_http_authorization;
            auth_request_set $s3_date $upstream_http_x_amz_date;
            auth_request_set $s3_sha $upstream_http_x_amz_content_sha256;
            auth_request_set $s3_token $upstream_http_x_amz_security_token;
            proxy_set_header Authorization $s3_auth;
            proxy_set_header X-Amz-Date $s3_date;
            proxy_set_header X-Amz-Content-SHA256 $s3_sha;
            proxy_set_header X-Amz-Security-Token $s3_token;
            proxy_set_header Host seaweedfs:8333;
            proxy_pass http://drive_objects/drive-media-storage/;
            add_header X-Robots-Tag noindex always;
        }
        location = /media-auth {
            internal;
            access_log off;
            proxy_pass http://drive_backend/api/v1.0/items/media-auth/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URL $request_uri;
            proxy_set_header X-Original-Method $request_method;
        }
    }
}
