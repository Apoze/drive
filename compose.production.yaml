name: drive-production

x-backend: &backend
  image: ${DRIVE_BACKEND_IMAGE:-apozedrive:backend-local}
  build:
    context: .
    target: backend-production
    args: { DOCKER_USER: "1000" }
  user: "1000:0"
  entrypoint: []
  env_file: ${DRIVE_CONFIG_FILE:-./env.d/production/backend.local}
  environment:
    DJANGO_CONFIGURATION: Production
    DB_HOST: database
    DB_PORT: "5432"
    DB_NAME: drive
    DB_USER: drive
    DB_PASSWORD_FILE: /run/secrets/database_password
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
    OIDC_RP_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    AWS_S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key
    AWS_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
    AWS_S3_ENDPOINT_URL: http://seaweedfs:8333
    AWS_STORAGE_BUCKET_NAME: drive-media-storage
    AWS_S3_REGION_NAME: us-east-1
    REDIS_URL: redis://redis:6379/0
    DJANGO_CELERY_BROKER_URL: redis://redis:6379/1
    MOUNTS_REGISTRY_FILE: /etc/drive/mounts.json
    STORAGE_SECRET_KEY_FILE: /run/secrets/storage_vault_key
  secrets: [database_password, django_secret_key, oidc_client_secret, s3_access_key, s3_secret_key, st_service_key, storage_vault_key]
  volumes:
    - scratch:/tmp
    - ${DRIVE_MOUNTS_FILE:-./env.d/production/mounts.local}:/etc/drive/mounts.json:ro
    - ${DRIVE_NAS_SECRETS_DIR:-./env.d/production/secrets/nas}:/run/secrets/nas:ro
    - ${DRIVE_CERTIFICATES_DIR:-./env.d/production/certificates}:/etc/drive/certificates:ro
  dns_opt: ["timeout:2", "attempts:2"]
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    database: { condition: service_healthy }
    redis: { condition: service_healthy }
    seaweedfs: { condition: service_healthy }

services:
  database:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: drive
      POSTGRES_USER: drive
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes: ["postgresql:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive -d drive"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  seaweedfs:
    image: ${DRIVE_S3_IMAGE:-chrislusf/seaweedfs@sha256:d0264e1bc39cb645f862620c5a92892ec7dd6eadff1df750608e743daa727f44}
    user: "1000:0"
    entrypoint: ["weed"]
    command: ["server", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-master.volumeSizeLimitMB=1024", "-volume.max=0", "-volume.minFreeSpace=5", "-filer", "-filer.exposeDirectoryData=false", "-s3", "-s3.config=/run/secrets/s3_config", "-s3.allowDeleteBucketNotEmpty=false"]
    secrets: [s3_config]
    volumes: ["objects:/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12
  backend:
    <<: *backend
    command: ["gunicorn", "-c", "/usr/local/etc/gunicorn/drive.py", "drive.wsgi:application"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/__heartbeat__', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 3
  worker:
    <<: *backend
    command: ["celery", "-A", "drive.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
  scheduler:
    <<: *backend
    command: ["celery", "-A", "drive.celery_app", "beat", "--loglevel=info", "--schedule=/data/celerybeat-schedule"]
    # The scheduler file is disposable; use tmpfs with the runtime UID.
    tmpfs: ["/data:uid=1000,gid=0,mode=750"]
  frontend:
    image: ${DRIVE_FRONTEND_IMAGE:-apozedrive:frontend-local}
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      target: frontend-production
      args: { DOCKER_USER: "101", API_ORIGIN: "/" }
    entrypoint: []
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  edge:
    image: nginx:1.30.4-alpine
    user: "101:101"
    entrypoint: []
    command: ["nginx", "-g", "daemon off;"]
    ports: ["127.0.0.1:${DRIVE_HTTP_PORT:-8970}:8080"]
    volumes: ["./docker/homelab/nginx.conf:/etc/nginx/nginx.conf:ro"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3

secrets:
  storage_vault_key:
    file: ${DRIVE_SECRETS_DIR:-./env.d/production/secrets}/storage_vault_key
  database_password:
    file: ${DRIVE_SECRETS_DIR:-./env.d/production/secrets}/database_password
  django_secret_key:
    file: ${DRIVE_SECRETS_DIR:-./env.d/production/secrets}/django_secret_key
  oidc_client_secret:
    file: ${DRIVE_SECRETS_DIR:-./env.d/production/secrets}/oidc_client_secret
  s3_access_key:
    file: ${DRIVE_SECRETS_DIR:-./env.d/production/secrets}/s3_access_key
  s3_secret_key:
    file: ${DRIVE_SECRETS_DIR:-./env.d/production/secrets}/s3_secret_key
  s3_config:
    file: ${DRIVE_SECRETS_DIR:-./env.d/production/secrets}/s3_config
  st_service_key:
    file: ${DRIVE_SECRETS_DIR:-./env.d/production/secrets}/st_service_key
volumes:
  postgresql:
  redis:
  objects:
  scratch:
